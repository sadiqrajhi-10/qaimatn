{% extends "base.html" %}
{% block title %}المهام{% endblock %}
{% block content %}
<p class="app-subtitle" style="margin-bottom:10px;">مهام لازم نسويها</p>

{% for item in items %}
<div class="list-row">
  <form method="POST" action="{{ url_for('tasks_toggle', item_id=item.id) }}" style="flex:1;">
    <button type="submit" class="row-click-btn {{ 'row-fading' if item.done else '' }}">
      <span class="row-info">
        <span class="item-name">{{ item.name }}</span>
        <span class="item-note">أضافها {{ item.added_by }} - {{ item.created_at | local_date }}</span>
  {% if item.due_at %}<span class="badge badge-amber"><i class="ti ti-bell"></i> {{ item.due_at | local_datetime }}</span>{% endif %}
      </span>
    </button>
  </form>
  <form method="POST" action="{{ url_for('tasks_delete', item_id=item.id) }}">
    <button type="submit" class="delete-btn"><i class="ti ti-x"></i></button>
  </form>
</div>
{% else %}
<p class="app-subtitle">ما فيه مهام توا 🎉</p>
{% endfor %}

<form method="POST" action="{{ url_for('tasks_add') }}" class="add-form">
  <div class="field">
    <label>إضافة مهمة جديدة</label>
        <input type="text" name="name" placeholder="حاجة لازم نديروها" required>
  </div>
  <div class="field">
    <label>الموعد (اختياري)</label>
    <input type="datetime-local" name="due_at" dir="ltr">
  </div>
  <button type="submit" class="btn btn-primary"><i class="ti ti-plus"></i> إضافة</button>
</form>
{% endblock %}
  </div>
