<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D9E75">
<title>{% block title %}قائمتنا{% endblock %}</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div>
      <p class="app-title">قائمتنا</p>
      {% if current_user %}<p class="app-subtitle">أهلاً {{ current_user }}</p>{% endif %}
    </div>
    {% if current_user %}
    <button class="avatar-btn {{ 'avatar-sadiq' if current_user == 'الصادق' else 'avatar-malak' }}"
            onclick="location.href='{{ url_for('switch_user') }}'" title="تبديل المستخدم">
      {{ current_user[0] }}
    </button>
    {% endif %}
  </header>

  {% with messages = get_flashed_messages() %}
    {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
  {% endwith %}

  <main class="app-content">
    {% block content %}{% endblock %}
  </main>

  {% if current_user %}
  <nav class="bottom-nav">
    <a href="{{ url_for('shopping') }}" class="{{ 'active' if request.endpoint == 'shopping' else '' }}">
      <i class="ti ti-shopping-cart"></i><span>النواقص</span>
    </a>
    <a href="{{ url_for('wishlist') }}" class="{{ 'active' if request.endpoint == 'wishlist' else '' }}">
      <i class="ti ti-heart"></i><span>أمنيات</span>
    </a>
    <a href="{{ url_for('meals') }}" class="{{ 'active' if request.endpoint == 'meals' else '' }}">
      <i class="ti ti-tools-kitchen-2"></i><span>الأكل</span>
    </a>
  </nav>
  {% endif %}
</div>
</body>
</html>
